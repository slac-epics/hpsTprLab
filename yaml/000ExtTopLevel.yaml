      at:
        offset: 0x802
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: FramesAfterTrigger
      mode: RW
      lsBit: 0
      sizeBits: 16
    #########################################################
    Status:
      at:
        offset: 0xA00
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: Status
      mode: RO
      sizeBits: 32
      lsBit: 0
      description: Include all of the status bits in one access
    #########################################################
    Empty:
      at:
        offset: 0xA00
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: Empty
      mode: RO
      sizeBits: 1
      lsBit: 0
    #########################################################
    Full:
      at:
        offset: 0xA00
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: Full
      mode: RO
      sizeBits: 1
      lsBit: 1
    #########################################################
    Done:
      at:
        offset: 0xA00
        stride: 4
        nelms: *numBuffers
      class: IntField
      name: Done
      mode: RO
      sizeBits: 1
      lsBit: 2
    #########################################################
    Triggered:
      at:
        offset: 0xA00
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: Triggered
      mode: RO
      sizeBits: 1
      lsBit: 3
    #########################################################
    Error:
      at:
        offset: 0xA00
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: Error
      mode: RO
      sizeBits: 1
      lsBit: 4
    #########################################################
    BurstSize:
      at:
        offset: 0xA01 # Same constant value for every buffer so only define one
      class: IntField
      name: BurstSize
      mode: RO
      sizeBits: 4
      lsBit: 0
    #########################################################
    FramesSinceTrigger:
      at:
        offset: 0xA02
        nelms: *numBuffers
        stride: 4
      class: IntField
      name: FramesSinceTrigger
      mode: RO
      sizeBits: 16
      lsBit: 0
    #########################################################
    Initialize:
      name: Initialize
      class: SequenceCommand
      at:
        offset: 0x0
      description: "Initialize the buffer. Reset the write pointer to StartAddr. Clear the Done field."
      nelms: *numBuffers
      sequence:
      - entry: Init[0]
        value: 0x1
      - entry: Init[1]
        value: 0x1
      - entry: Init[2]
        value: 0x1
      - entry: Init[3]
        value: 0x1
      - entry: Init[0]
        value: 0x0
      - entry: Init[1]
        value: 0x0
      - entry: Init[2]
        value: 0x0
      - entry: Init[3]
        value: 0x0
    #########################################################
    C_SoftTrigger:
      name: C_SoftTrigger
      class: SequenceCommand
      at:
        offset: 0x0
      description: Send a trigger to the buffer
      nelms: *numBuffers
      sequence:
      - entry: SoftTrigger
        value: 0x1
      - entry: SoftTrigger
        value: 0x0
    #########################################################
    SoftTriggerAll:
      name: SoftTriggerAll
      class: SequenceCommand
      at:
        offset: 0x0
      description: Send a trigger to the buffer
      sequence:
      - entry: SoftTrigger
        value: 1

