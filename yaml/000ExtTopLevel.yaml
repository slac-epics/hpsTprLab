    #########################################################
      at:
        offset: 0x40
      class: IntField
      name: ErrAck
      sizeBits: 1
      lsBit: 3
      mode: RO
      description: Error in acknowledgment mechanism.
    ErrSsiFrameLen:
    #########################################################
      at:
        offset: 0x40
      class: IntField
      name: ErrSsiFrameLen
      sizeBits: 1
      lsBit: 4
      mode: RO
      description: SSI Frame length too long
    ErrConnTout:
    #########################################################
      at:
        offset: 0x40
      class: IntField
      name: ErrConnTout
