    C_OpenConn:
      class: SequenceCommand
      at:
        offset: 0x0
      description: Open connection request
      sequence:
      - entry: OpenConn
        value: 0x1
      - entry: OpenConn
        value: 0x0
    #########################################################
    C_CloseConn:
      class: SequenceCommand
      at:
        offset: 0x0
      description: Close connection request
      sequence:
      - entry: CloseConn
        value: 0x1
      - entry: CloseConn
        value: 0x0
    #########################################################
    C_InjectFault:
      class: SequenceCommand
      at:
        offset: 0x0
