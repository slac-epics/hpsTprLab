RssiCore: &RssiCore
  class: MMIODev
  configPrio: 1
  description: RSSI module
  size: 0x100
  children:
    OpenConn:
      at:
        offset: 0x00
      class: IntField
      name: OpenConn
      sizeBits: 1
      lsBit: 0
      mode: RW
      description: Open Connection Request (Server goes to listen state, Client actively
        requests the connection by sending SYN segment)
    CloseConn:
    #########################################################
      at:
        offset: 0x00
      class: IntField
      name: CloseConn
      sizeBits: 1
      lsBit: 1
      mode: RW
      description: Close Connection Request (Send a RST Segment to peer and close
        the connection)
    Mode:
    #########################################################
      at:
        offset: 0x00
      class: IntField
      name: Mode
      sizeBits: 1
      lsBit: 2
      mode: RW
      description: 'Mode:''0'': Use internal parameters from generics,''1'': Use parameters
        from registers'
