      sizeBits: 16
      mode: RW
      description: Maximum segment size [15:0]
    RetransTimeout:
    #########################################################
      at:
        offset: 0x14
      class: IntField
      name: RetransTimeout
      sizeBits: 16
      mode: RW
      description: Retransmission timeout [15:0]
    CumAckTimeout:
    #########################################################
      at:
        offset: 0x18
      class: IntField
