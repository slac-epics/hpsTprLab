      mode: RW
      description: Null segment timeout [15:0]
    MaxNumRetrans:
    #########################################################
      at:
        offset: 0x20
      class: IntField
      name: MaxNumRetrans
      sizeBits: 8
      mode: RW
      description: Maximum number of retransmissions [7:0]
    MaxCumAck:
    #########################################################
      at:
        offset: 0x24
      class: IntField
      name: MaxCumAck
      sizeBits: 8
      mode: RW
      description: Maximum cumulative acknowledgments [7:0]
    MaxOutOfSeq:
    #########################################################
      at:
        offset: 0x28
      class: IntField
      name: MaxOutOfSeq
      sizeBits: 8
      mode: RW
