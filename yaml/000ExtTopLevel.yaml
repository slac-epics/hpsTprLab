  size: 0x10000
  children:
    #########################################################
    sofCount:
      at:
        offset: 0x0000
      class: IntField
      name: sofCount
      sizeBits: 32
      lsBit: 0
      mode: RO
      description: Start of frame count
    #########################################################
    eofCount:
      at:
        offset: 0x0004
      class: IntField
