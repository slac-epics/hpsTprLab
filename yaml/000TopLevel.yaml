#schemaversion 3.0.0
#once
#include AmcCarrierEmpty.yaml
#include AmcCarrierDRAM.yaml

#MMIO range, will be attached to FPGA
mmio: &mmio
  size: 0x100000000 # 4GB of address space
  class: MMIODev
  configPrio: 1
  children:
      AmcCarrierEmpty:
          <<: *AmcCarrierEmpty
          at:
            offset: 0x00000000      

strm: &strm
  size: 0x100000000 # 4GB of address space
  class: MMIODev
  children:
      AmcCarrierDRAM:
          <<: *AmcCarrierDRAM
          at:
            offset: 0x00000000     

tstream: &tstream
  SRP:
      protocolVersion: SRP_UDP_NONE
  UDP:
      port: 8197
      pollSecs: 1


NetIODev:
  ipAddr: 10.0.3.105
  class: NetIODev
  configPrio: 1
  children:
     mmio:
       <<: *mmio
       at:
         SRP:
           protocolVersion: SRP_UDP_V3
         UDP:
           port: 8193
         RSSI:
         depack:
           useDepack: yes
         TDESTMux:
           TDEST: 0
     strm:
       <<: *strm
       at:
         SRP:
           protocolVersion: SRP_UDP_V3
         UDP:
           port: 8194
         RSSI: yes
         depack:
           useDepack: yes
         TDESTMux:
           TDEST: 4
     tstream:
         class: Field
         at:
           <<: *tstream

